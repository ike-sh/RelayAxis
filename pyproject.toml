[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relayaxis"
version = "0.1.0"
description = "Realm + WireGuard multi-ingress, multi-egress orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "RelayAxis contributors"}]
dependencies = []

[project.scripts]
ra = "relayaxis.cli:main"

[tool.setuptools.packages.find]
include = ["relayaxis*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101", "S603", "S607", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]
